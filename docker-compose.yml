services:

  #  Banco de dados — MySQL 8
  db:
    image: mysql:8.0
    container_name: bere_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      # Persiste os dados mesmo que o container seja removido
      - mysql_data:/var/lib/mysql
    healthcheck:
      # A API só vai subir depois que o MySQL estiver aceitando conexões
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  #  API — FastAPI + Python 3.12
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: bere_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM}
      SESSAO_CLIENTE_HORAS: ${SESSAO_CLIENTE_HORAS:-3}
      SESSAO_ADMIN_DIAS: ${SESSAO_ADMIN_DIAS:-30}
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN}
      MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET:-}
      MERCADOPAGO_SANDBOX: ${MERCADOPAGO_SANDBOX:-true}
      # E-mail (BG-15). Sem nada no .env, usa o Mailpit abaixo — nada sai para a internet
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SEGURANCA: ${SMTP_SEGURANCA:-nenhuma}
      SMTP_REMETENTE: ${SMTP_REMETENTE:-nao-responda@donabere.local}
    ports:
      - "8000:8000"
    volumes:
      # Monta o código local dentro do container (hot reload em dev)
      - ./api:/app
    # Roda as migrations antes de iniciar o servidor
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  #  Mailpit — caixa de entrada falsa para desenvolvimento
  # Recebe todos os e-mails enviados pela API e mostra em http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.20.0
    container_name: bere_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"

#  Volumes persistentes
volumes:
  mysql_data:
    driver: local