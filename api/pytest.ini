[pytest]
# Testes automatizados (BG-22): docker exec bere_api pytest
testpaths = tests
# Raiz da API (pacote app) e a pasta dos testes (apoio.py) no caminho de importação
pythonpath = . tests
addopts = -q
filterwarnings =
    # Aviso interno do FastAPI/Starlette sobre o httpx, não é do projeto
    ignore:Using .httpx. with .starlette.testclient. is deprecated
